<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Abstract nacre portrait placeholder for Pierre Wallin">
  <defs>
    <radialGradient id="bg" cx="30%" cy="22%" r="92%">
      <stop offset="0%" stop-color="#1b1a33"/>
      <stop offset="55%" stop-color="#0d0e17"/>
      <stop offset="100%" stop-color="#07080c"/>
    </radialGradient>
    <linearGradient id="iri" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd6e8"/>
      <stop offset="34%" stop-color="#c4b5fd"/>
      <stop offset="68%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <linearGradient id="iri2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a7f3d0" stop-opacity=".9"/>
      <stop offset="50%" stop-color="#c4b5fd" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#ffd6e8" stop-opacity=".2"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <circle cx="126" cy="112" r="96" fill="#c4b5fd" opacity=".22" filter="url(#soft)"/>
  <circle cx="290" cy="268" r="104" fill="#7dd3fc" opacity=".18" filter="url(#soft)"/>

  <!-- nacre rings -->
  <g fill="none" stroke="url(#iri)" opacity=".55">
    <circle cx="200" cy="196" r="128" stroke-width="1"/>
    <circle cx="200" cy="196" r="104" stroke-width="1.2" opacity=".8"/>
    <circle cx="200" cy="196" r="80"  stroke-width="1.5"/>
    <circle cx="200" cy="196" r="56"  stroke-width="1.8" opacity=".9"/>
    <circle cx="200" cy="196" r="32"  stroke-width="2"/>
  </g>

  <!-- memory graph nodes -->
  <g fill="url(#iri2)">
    <circle cx="200" cy="68"  r="4"/>
    <circle cx="308" cy="140" r="3.2"/>
    <circle cx="288" cy="276" r="4.4"/>
    <circle cx="150" cy="300" r="3"/>
    <circle cx="86"  cy="182" r="3.6"/>
    <circle cx="242" cy="196" r="2.6"/>
    <circle cx="164" cy="150" r="3"/>
  </g>
  <g stroke="url(#iri2)" stroke-width=".9" opacity=".65" fill="none">
    <path d="M200 68 L308 140 L288 276 L150 300 L86 182 Z"/>
    <path d="M164 150 L242 196 L288 276"/>
    <path d="M86 182 L164 150 L200 68"/>
  </g>

  <!-- pearl core -->
  <circle cx="200" cy="196" r="20" fill="url(#iri)" opacity=".95"/>
  <circle cx="193" cy="189" r="6" fill="#fff" opacity=".8"/>

  <text x="200" y="368" text-anchor="middle"
        font-family="'JetBrains Mono', ui-monospace, monospace"
        font-size="13" letter-spacing="7" fill="#8b93a6">PW</text>
</svg>
